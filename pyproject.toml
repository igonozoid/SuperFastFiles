[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "superfastfiles"
version = "0.2.0"
description = "Copiador de arquivos rápido e multiplataforma (inspirado no FastCopy)"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.7", "qtawesome>=1.3", "xxhash>=3.4"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4"]
build = ["pyinstaller>=6.10"]

[project.scripts]
superfastfiles = "superfastfiles.__main__:main"
sff = "superfastfiles.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
superfastfiles = ["assets/fonts/*", "assets/locales/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
